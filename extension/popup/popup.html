<!DOCTYPE html>
<html>
<head>
    <title>FOCUS</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js"></script>
</head>

<body>

    <!-- LOGO -->
    <div class="logo-container">
        <img src="focus.jpg.png" alt="FOCUS Logo" class="logo">
    </div>

    <div class="header">
        <h2>FOCUS DSA TRACKER</h2>
    </div>

    <div class="card">
        <span>Difficulty</span>
        <strong id="difficulty">easy</strong>
    </div>

    <div class="card">
        <span>Focus Time</span>
        <strong id="focusTime">00:00:00</strong>
    </div>

    <div class="card">
        <span>Idle Time</span>
        <strong id="idleTime">00:00:00</strong>
    </div>

    <div class="card">
        <span>Tab Switches</span>
        <strong id="tabSwitches">0</strong>
    </div>

    <div class="card">
        <span>Submission Count</span>
        <strong id="submissions">0</strong>
    </div>

</body>
</html>
